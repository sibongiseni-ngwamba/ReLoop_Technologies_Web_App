name: Deploy ReLoop web app and REST API

on:
  push:
    branches: [all-updates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore tests/ReLoop_Technologies_Web_App.Tests/ReLoop_Technologies_Web_App.Tests.csproj
      - run: dotnet test tests/ReLoop_Technologies_Web_App.Tests/ReLoop_Technologies_Web_App.Tests.csproj --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          for name in WORKLOAD_IDENTITY_PROVIDER DEPLOY_SERVICE_ACCOUNT RUNTIME_SERVICE_ACCOUNT REGION SERVICE_NAME SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "Required deployment setting $name is not configured." >&2; exit 1; fi
          done
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          project_id: relooptechnologies-2eda2
          region: ${{ vars.GCP_REGION }}
          source: .
          env_vars: |-
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_HTTP_PORTS=8080
            Supabase__Url=${{ vars.SUPABASE_URL }}
            Supabase__AnonKey=${{ vars.SUPABASE_ANON_KEY }}
          secrets: |-
            Supabase__ConnectionString=SUPABASE_CONNECTION_STRING:latest
          flags: --allow-unauthenticated --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
